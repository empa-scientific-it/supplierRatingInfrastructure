services:
  frontend:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: spring-app:v1
    container_name: spring-backend
    restart: unless-stopped
    environment:
      - OPENBIS_API_URL=${OPENBIS_API_URL}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
