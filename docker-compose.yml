services:
  backend:
    container_name: backend
    build: ./supplierRatingBackend
    ports:
      - "8080:8080"
    env_file:
      - ./supplierRatingBackend/.env.production
    networks:
      - rating-network

  frontend:
    container_name: frontend
    build: ./supplierRatingFrontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - rating-network

networks:
  rating-network:
    driver: bridge
